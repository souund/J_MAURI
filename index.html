<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J MAURI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">J MAURI</div>
    <nav class="nav">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">Biografía</a></li>
        <li><a href="#music">Música</a></li>
        <li><a href="#gallery">Galería</a></li>
        <li><a href="#booking">Booking</a></li>
        <li><a href="#contact">Contacto</a></li>
      </ul>
    </nav>
    <div class="menu-toggle" id="menu-toggle">
      <span></span><span></span><span></span>
    </div>
  </header>

  <section id="home" class="hero">
    <div class="hero-content">
      <h1>J MAURI</h1>
      <p>DJ · Producer</p>
    </div>
  </section>

  <section id="about" class="about">
    <h2>Biografía</h2>
    <p><!-- Texto de biografía aquí --></p>
  </section>

  <section id="music" class="music">
    <h2>Música</h2>
    <div class="music-grid">
      <!-- Tracks / players aquí -->
    </div>
  </section>

  <section id="gallery" class="gallery">
    <h2>Galería</h2>
    <div class="gallery-grid">
      <!-- Imágenes aquí -->
    </div>
  </section>

  <section id="booking" class="booking">
    <h2>Booking</h2>
    <p><!-- Info de booking / EPK aquí --></p>
  </section>

  <section id="contact" class="contact">
    <h2>Contacto</h2>
    <form id="contact-form">
      <input type="text" name="name" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" placeholder="Mensaje" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>

  <footer class="footer">
    <div class="social">
      <!-- Iconos redes sociales aquí -->
    </div>
    <p>&copy; 2026 J MAURI. Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
